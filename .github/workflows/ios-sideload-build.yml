name: iOS Sideload Build (unsigned .ipa + AltStore source)

# Produces an UNSIGNED .ipa for installing on a real device without owning
# a Mac, and publishes it (+ an AltStore-compatible source.json --
# https://faq.altstore.io/developers/make-a-source) via raw.githubusercontent.com,
# committing both into distribution/ on every build.
#
# NOTE on why raw.githubusercontent.com and not a GitHub Release asset: a
# Release asset URL (github.com/.../releases/download/...) 302-redirects to
# a signed, time-limited Azure blob URL. curl -L follows that fine, but
# AltStore's installer failed on it with "the data couldn't be read because
# it isn't in the correct format" -- almost certainly AltStore's downloader
# not following (or mishandling) that redirect chain, since the .ipa itself
# verified as a perfectly valid zip/Mach-O/plist when inspected directly.
# raw.githubusercontent.com serves the committed file directly in one hop,
# no redirect, no expiry -- and it's exactly what already worked fine for
# distribution/icon.png. Trade-off: this commits a new ~80KB binary blob to
# the repo on every build. Fine at hobby-project build volumes; if this
# repo ever does thousands of iOS-touching pushes, revisit (e.g. squash
# distribution/ history periodically, or move to Git LFS).
#
# One-time setup on the phone: add
#   https://raw.githubusercontent.com/uid01/glasses/main/distribution/source.json
# as a custom source in AltStore (or SideStore). After that, every push
# that touches the iOS client bumps the build number and republishes to
# the SAME URLs, so AltStore just shows an "Update" button -- no more
# re-uploading to a signing service by hand for every rebuild. Signulous/
# Sideloadly still work fine as an alternative any time.
#
# The app requires no paid-only capabilities (no push notifications, App
# Groups, iCloud -- just the standard NSLocalNetworkUsageDescription
# permission), so a free personal Apple ID is sufficient for AltServer to
# sign it. Free-account signatures still expire after 7 days; AltServer
# auto-refreshes those in the background as long as it (or SideStore's
# self-refresh) can periodically reach the device -- that's a signing
# renewal, separate from this workflow, which only ever ships new *builds*.

on:
  push:
    paths:
      - "ios-client/**"
      - "shared-protocol/PROTOCOL.md"
      - ".github/workflows/ios-sideload-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build unsigned .ipa and publish AltStore source
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for device (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-client/XrealBridge.xcodeproj \
            -scheme XrealBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0" \
            clean build

      - name: Package as .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/XrealBridge.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r XrealBridge-unsigned.ipa Payload
          mkdir -p distribution
          cp XrealBridge-unsigned.ipa distribution/XrealBridge-unsigned.ipa
          echo "Built: $(ls -lh distribution/XrealBridge-unsigned.ipa)"

      - name: Generate AltStore source.json
        run: |
          set -euo pipefail
          SIZE=$(wc -c < distribution/XrealBridge-unsigned.ipa | tr -d ' ')
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="uid01/glasses"
          RAW_BASE="https://raw.githubusercontent.com/${REPO}/main/distribution"

          cat > distribution/source.json <<JSON
          {
            "name": "XrealBridge (personal builds)",
            "subtitle": "PC-to-iOS XREAL display + trackpad bridge",
            "description": "Auto-published dev builds of the XrealBridge iOS client. Unsigned -- AltStore/SideStore re-signs at install/update time.",
            "iconURL": "${RAW_BASE}/icon.png",
            "website": "https://github.com/${REPO}",
            "tintColor": "40c8ff",
            "nsfw": false,
            "apps": [
              {
                "name": "XrealBridge",
                "bundleIdentifier": "com.xrealbridge.XrealBridge",
                "developerName": "uid01",
                "subtitle": "XREAL display + trackpad bridge",
                "localizedDescription": "Streams the PC desktop to XREAL glasses via USB-C and turns the iPhone screen into a wireless trackpad. Personal dev build, unsigned -- see shared-protocol/PROTOCOL.md in the source repo for the wire format.",
                "iconURL": "${RAW_BASE}/icon.png",
                "tintColor": "40c8ff",
                "category": "utilities",
                "versions": [
                  {
                    "version": "1.0",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "${DATE}",
                    "localizedDescription": "Build ${{ github.run_number }} (commit ${{ github.sha }})",
                    "downloadURL": "${RAW_BASE}/XrealBridge-unsigned.ipa",
                    "size": ${SIZE},
                    "minOSVersion": "17.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {
                    "NSLocalNetworkUsageDescription": "Connects to your PC over local Wi-Fi/LAN to stream its screen and send trackpad input."
                  }
                }
              }
            ],
            "news": []
          }
          JSON
          cat distribution/source.json

      - name: Commit and push distribution/ (ipa + source.json)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/XrealBridge-unsigned.ipa distribution/source.json
          if git diff --cached --quiet; then
            echo "No changes to publish (identical build output)."
            exit 0
          fi
          git commit -m "Publish sideload build ${{ github.run_number }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published build ${{ github.run_number }}:"
          echo "  ipa:        https://raw.githubusercontent.com/uid01/glasses/main/distribution/XrealBridge-unsigned.ipa"
          echo "  source.json: https://raw.githubusercontent.com/uid01/glasses/main/distribution/source.json"

      - name: Upload .ipa as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: XrealBridge-unsigned-ipa
          path: distribution/XrealBridge-unsigned.ipa
          retention-days: 14
